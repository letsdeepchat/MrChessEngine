name: puzzle-data
on:
  push:
    branches: [puzzle-data]
    paths: [scripts/extract_gm_puzzles.py, .github/workflows/puzzles.yml]
permissions:
  contents: write
jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download and filter the Lichess puzzle database (CC0)
        run: |
          mkdir -p app/src/main/assets
          curl -sSfL https://database.lichess.org/lichess_db_puzzle.csv.zst | zstd -dc \
            | python3 scripts/extract_gm_puzzles.py app/src/main/assets/puzzles_gm.csv
          wc -c app/src/main/assets/puzzles_gm.csv
      - name: Commit the asset
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/assets/puzzles_gm.csv
          git commit -m "Add grandmaster-level puzzle set (Lichess puzzle database, CC0)"
          git push origin HEAD:puzzle-data
