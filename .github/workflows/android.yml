name: Build APK

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  core-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - uses: gradle/actions/setup-gradle@v4
      - run: sudo apt-get update && sudo apt-get install -y stockfish
      - run: ./gradlew :chesscore:test -PcoreOnly=true
        env: { STOCKFISH_PATH: /usr/games/stockfish }

  apk:
    runs-on: ubuntu-latest
    needs: core-tests
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - uses: gradle/actions/setup-gradle@v4
      - name: Install NDK
        run: echo "y" | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "ndk;27.2.12479018"
      - name: Build Stockfish for arm64
        run: ANDROID_NDK_HOME="$ANDROID_HOME/ndk/27.2.12479018" scripts/build_stockfish_android.sh
      - run: ./gradlew :app:assembleRelease
      - name: APK size
        run: ls -lh app/build/outputs/apk/release/
      - uses: actions/upload-artifact@v4
        with:
          name: mrchess-trainer-apk
          path: app/build/outputs/apk/release/*.apk
