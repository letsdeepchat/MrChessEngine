name: Build APK

on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  core-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - uses: gradle/actions/setup-gradle@v4
      - run: sudo apt-get update && sudo apt-get install -y stockfish
      - run: ./gradlew :chesscore:test -PcoreOnly=true
        env: { STOCKFISH_PATH: /usr/games/stockfish }

  apk:
    runs-on: ubuntu-latest
    needs: core-tests
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - uses: gradle/actions/setup-gradle@v4
      - name: Install NDK
        run: echo "y" | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "ndk;27.2.12479018"
      - name: Build Stockfish for arm64
        run: ANDROID_NDK_HOME="$ANDROID_HOME/ndk/27.2.12479018" scripts/build_stockfish_android.sh
      - run: ./gradlew :app:assembleRelease
      - name: APK size
        run: ls -lh app/build/outputs/apk/release/
      - uses: actions/upload-artifact@v4
        with:
          name: mrchess-trainer-apk
          path: app/build/outputs/apk/release/*.apk
      - name: Publish GitHub Release (tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          cp app/build/outputs/apk/release/app-release.apk "MrChessTrainer-$TAG.apk"
          gh release create "$TAG" "MrChessTrainer-$TAG.apk" \
            --title "MrChess Trainer $TAG" \
            --notes "Offline chess trainer for Android (arm64, Android 8+). Download MrChessTrainer-$TAG.apk, open it on your phone and allow installing from this source." \
            || gh release upload "$TAG" "MrChessTrainer-$TAG.apk" --clobber
