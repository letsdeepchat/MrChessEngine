name: Build APK

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  core-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - uses: gradle/actions/setup-gradle@v4
      - run: sudo apt-get update && sudo apt-get install -y stockfish
      - run: ./gradlew :chesscore:test -PcoreOnly=true
        env: { STOCKFISH_PATH: /usr/games/stockfish }

  apk:
    runs-on: ubuntu-latest
    needs: core-tests
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - uses: gradle/actions/setup-gradle@v4
      - name: Install NDK
        run: echo "y" | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "ndk;27.2.12479018"
      - name: Build Stockfish for arm64
        run: ANDROID_NDK_HOME="$ANDROID_HOME/ndk/27.2.12479018" scripts/build_stockfish_android.sh
      - run: ./gradlew :app:assembleRelease
      # The optional cloud-backup module is not linked into the default APK; make sure it still compiles.
      - run: ./gradlew :cloudsync:compileReleaseKotlin
      - name: APK size
        run: ls -lh app/build/outputs/apk/release/
      - uses: actions/upload-artifact@v4
        with:
          name: mrchess-trainer-apk
          path: app/build/outputs/apk/release/*.apk
      - name: Publish GitHub Release (main branch)
        # One-click download, always the newest build:
        # https://github.com/<owner>/<repo>/releases/latest/download/MrChessTrainer.apk
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=$(grep -oP 'versionName = "\K[^"]+' app/build.gradle.kts)
          TAG="v$VERSION"
          cp app/build/outputs/apk/release/app-release.apk MrChessTrainer.apk
          NOTES="Offline chess trainer for Android (64-bit phones, Android 8+). Tap MrChessTrainer.apk below to download, open it on your phone and allow installing from this source. Built from ${GITHUB_SHA::7}."
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" MrChessTrainer.apk --clobber
            gh release edit "$TAG" --notes "$NOTES"
          else
            gh release create "$TAG" MrChessTrainer.apk --target "$GITHUB_SHA" --title "MrChess Trainer $TAG" --notes "$NOTES" --latest
          fi
