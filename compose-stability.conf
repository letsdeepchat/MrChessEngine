// instance), but the Compose compiler can't see that across modules. Declaring them stable lets
// the board, move strip and top bar skip recomposition when their inputs didn't change.
com.mrchess.core.rules.*
com.mrchess.core.review.*
com.mrchess.core.explain.*
com.mrchess.core.engine.Score
com.mrchess.core.puzzle.*
com.mrchess.core.online.*
kotlin.Pair
